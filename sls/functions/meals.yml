createMeal:
  handler: src/main/functions/meals/create-meal.handler
  events:
    - httpApi:
        path: /meals
        method: POST
        authorizer:
          name: CognitoAuthorizer

listMealsByDate:
  handler: src/main/functions/meals/list-meals-by-date.handler
  events:
    - httpApi:
        path: /meals
        method: GET
        authorizer:
          name: CognitoAuthorizer

getMealById:
  handler: src/main/functions/meals/get-meal-by-id.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: GET
        authorizer:
          name: CognitoAuthorizer

deleteMeal:
  handler: src/main/functions/meals/delete-meal.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer

onMealFileUploaded:
  handler: src/main/functions/meals/_triggers/on-meal-file-uploaded.handler
  events:
    - s3:
        bucket: !Ref MealsBucket
        event: s3:ObjectCreated:*
        existing: true
        forceDeploy: true

processMeal:
  handler: src/main/functions/meals/_queues/process-meal.handler
  memorySize: 1024
  timeout: 120
  events:
    - sqs:
        arn: !GetAtt MealsQueue.Arn
        batchSize: 2 # numero maximo de mensagens que pode dentro do event.Records.batch
        maximumConcurrency: 10 # maximo de lambdas que podem ser invocadas simultaneamente
        maximumBatchingWindow:
          10 # tempo que a lambda consumer espera para capturar as mensagens, com fins de acumular
          # se chegar no numero do batchSize, a lambda eh invocada imediatamente
        functionResponseType: ReportBatchItemFailures # conseguimos reportar quais mensagens falharam, evitando que as que foram executadas com sucesso sejam tratadas como se tivessem dado erro
