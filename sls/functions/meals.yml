createMeal:
  handler: src/main/functions/meals/create-meal.handler
  events:
    - httpApi:
        path: /meals
        method: POST
        authorizer:
          name: CognitoAuthorizer

listMealsByDate:
  handler: src/main/functions/meals/list-meals-by-date.handler
  events:
    - httpApi:
        path: /meals
        method: GET
        authorizer:
          name: CognitoAuthorizer

getMealById:
  handler: src/main/functions/meals/get-meal-by-id.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: GET
        authorizer:
          name: CognitoAuthorizer

deleteMeal:
  handler: src/main/functions/meals/delete-meal.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer
