createMeal:
  handler: src/main/functions/meals/create-meal.handler
  events:
    - httpApi:
        path: /meals
        method: POST
        authorizer:
          name: CognitoAuthorizer

listMealsByDate:
  handler: src/main/functions/meals/list-meals-by-date.handler
  events:
    - httpApi:
        path: /meals
        method: GET
        authorizer:
          name: CognitoAuthorizer
