signup:
  handler: src/main/functions/auth/signup.handler
  events:
    - httpApi:
        path: /auth/signup
        method: POST

signin:
  handler: src/main/functions/auth/signin.handler
  events:
    - httpApi:
        path: /auth/signin
        method: POST

refreshToken:
  handler: src/main/functions/auth/refresh-token.handler
  events:
    - httpApi:
        path: /auth/refresh-token
        method: POST

forgotPassword:
  handler: src/main/functions/auth/forgot-password.handler
  events:
    - httpApi:
        path: /auth/forgot-password
        method: POST

preSignupTrigger:
  handler: src/main/functions/auth/_triggers/pre-signup.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.PoolName}
        trigger: PreSignUp
        existing: true
        forceDeploy: true

preTokenGenerationTrigger:
  handler: src/main/functions/auth/_triggers/pre-token-generation.handler
