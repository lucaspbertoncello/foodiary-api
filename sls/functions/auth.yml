signup:
  handler: src/main/functions/auth/signup.handler
  events:
    - httpApi:
        path: /auth/signup
        method: POST

preSignupTrigger:
  handler: src/main/functions/auth/_triggers/pre-signup.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.PoolName}
        trigger: PreSignUp
        existing: true
        forceDeploy: true
